---
services:
  db:
    build: ./database
    image: ${IMAGE_REPO:-kiransai006/python-code-library-app}:db-${TAG:-latest}
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "0.5"
          memory: 512M

  auth_service:
    build: ./auth
    image: ${IMAGE_REPO:-kiransai006/python-code-library-app}:auth-${TAG:-latest}
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    build: ./book
    image: ${IMAGE_REPO:-kiransai006/python-code-library-app}:book-${TAG:-latest}
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    build: ./borrow
    image: ${IMAGE_REPO:-kiransai006/python-code-library-app}:borrow-${TAG:-latest}
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  frontend:
    build: ./
    image: ${IMAGE_REPO:-kiransai006/python-code-library-app}:frontend-${TAG:-latest}
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

networks:
  myapp:
    driver: bridge

volumes:
  mydata:
